info:
  name: changePrice
  type: http

http:
  method: PATCH
  url: http://127.0.0.1:8080/api/v1/services/price?service_id=7&price=1200
  params:
    - name: service_id
      value: "7"
      type: query
    - name: price
      value: "1200"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
